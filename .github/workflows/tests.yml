name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Build Sudoku extension
        run: make build-sudoku

      - name: Run tests
        # conftest.py forces pynput's dummy backend, so no display is needed
        run: python -m pytest
