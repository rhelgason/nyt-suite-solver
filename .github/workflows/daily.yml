name: Daily solve

on:
  schedule:
    # 08:30 UTC ~= 04:30 ET, safely after the NYT puzzles refresh for the day
    - cron: "30 8 * * *"
  workflow_dispatch:

# allow the workflow to commit the day's solutions back to the repo, and to call
# GitHub Models (the free, token-authenticated LLM used by Connections and the
# Mini crossword -- no external API key required)
permissions:
  contents: write
  models: read

concurrency:
  group: daily-solve
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build solver extensions
        run: make build

      - name: Solve today's puzzles
        id: solve
        continue-on-error: true
        env:
          # GitHub Models authenticates with the built-in workflow token; the
          # optional GEMINI_API_KEY secret, if set, is used as a fallback.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/cli.py --game all

      - name: Regenerate README stats
        if: always()
        run: python src/stats.py

      - name: Commit new solutions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add solutions/ README.md stats/
          if git diff --cached --quiet; then
            echo "No new solutions to commit."
          else
            git commit -m "Daily solve: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Fail if any puzzle did not solve
        if: steps.solve.outcome == 'failure'
        run: |
          echo "One or more puzzles failed to solve; see the Solve step logs."
          exit 1
